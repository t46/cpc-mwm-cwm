[project]
name = "cpc-mwm-cwm"
version = "0.1.0"
description = "CPC MWM-CWM workspace"
requires-python = ">=3.12"
dependencies = [
    "agent-utils",
    "cpc-cwm",
    "cpc-mwm",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agent-utils = { workspace = true }
cpc-cwm = { workspace = true }
cpc-mwm = { workspace = true }
